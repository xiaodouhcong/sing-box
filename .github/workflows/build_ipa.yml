name: Build IPA (TrollStore)

on:
  workflow_dispatch:

jobs:
  build_ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: xiaodouhcong/sing-box
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.24
          cache: true

      - name: Cache gomobile
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: gomobile-${{ hashFiles('go.mod') }}

      - name: Install gomobile
        run: |
          make lib_install
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Cache libbox
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: "*.xcframework"
          key: libbox-${{ hashFiles('go.mod', 'go.sum', 'experimental/libbox/**') }}

      - name: Build libbox for Apple
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: make lib_apple

      - name: Checkout sing-box-for-apple
        uses: actions/checkout@v4
        with:
          repository: xiaodouhcong/sing-box-for-apple
          path: sing-box-for-apple
          ref: dev
          fetch-depth: 0
          submodules: recursive

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-deriveddata-${{ hashFiles('sing-box-for-apple/**/*.swift', 'sing-box-for-apple/**/*.xcodeproj') }}
          restore-keys: |
            xcode-deriveddata-

      - name: Copy libbox to apple project
        run: |
          cp -r *.xcframework sing-box-for-apple/ 2>/dev/null || true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Build IPA (unsigned, for TrollStore)
        working-directory: sing-box-for-apple
        run: |
          xcodebuild archive \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SFI.xcarchive \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            | xcbeautify || true

          mkdir -p build/SFI-ipa/Payload
          cp -r build/SFI.xcarchive/Products/Applications/*.app build/SFI-ipa/Payload/
          cd build/SFI-ipa
          zip -r ../SFI.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-TrollStore
          path: sing-box-for-apple/build/SFI.ipa
          retention-days: 7
